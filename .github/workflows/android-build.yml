
name: Premika Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - Premika

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Web App
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon.png assets/icon.png
          npm init -y
          npm install @capacitor/core@^7 @capacitor/android@^7 @capacitor/cli@^7 @capacitor/assets

      - name: Initialize Capacitor
        run: |
          npx cap init Premika com.nothing8420.premika --web-dir=www
          npx cap add android

      - name: Generate Premika App Icon
        run: |
          npx capacitor-assets generate --android

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Premika-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
